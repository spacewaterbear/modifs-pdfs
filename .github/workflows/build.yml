name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: modifs-pdfs-linux
          - os: windows-latest
            artifact: modifs-pdfs-windows
          - os: macos-latest
            artifact: modifs-pdfs-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Build
        working-directory: code
        run: uv run pyinstaller modifs_pdfs.spec

      - name: Zip (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: zip -r ${{ matrix.artifact }}.zip code/dist/

      - name: Zip (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path code/dist/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package .deb (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          ARCH=amd64
          PKG_DIR=modifs-pdfs-deb

          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/applications"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/512x512/apps"

          cp "code/dist/Modifs PDFs" "$PKG_DIR/usr/bin/modifs-pdfs"
          chmod 755 "$PKG_DIR/usr/bin/modifs-pdfs"
          cp packaging/linux/modifs-pdfs.desktop "$PKG_DIR/usr/share/applications/modifs-pdfs.desktop"
          cp code/src/main/icons/linux/128.png "$PKG_DIR/usr/share/icons/hicolor/128x128/apps/modifs-pdfs.png"
          cp code/src/main/icons/linux/512.png "$PKG_DIR/usr/share/icons/hicolor/512x512/apps/modifs-pdfs.png"

          {
            echo "Package: modifs-pdfs"
            echo "Version: ${VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: ${ARCH}"
            echo "Maintainer: spacewaterbear <emmanuel.thiery.pro@gmail.com>"
            echo "Description: PDF merge and split desktop application"
            echo " Modifs PDFs is a simple desktop tool for merging and splitting PDF files."
          } > "$PKG_DIR/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$PKG_DIR" "modifs-pdfs_${VERSION}_${ARCH}.deb"

      - name: Package AppImage (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          APPDIR=ModifsPDFs.AppDir

          mkdir -p "$APPDIR/usr/bin"
          cp "code/dist/Modifs PDFs" "$APPDIR/usr/bin/modifs-pdfs"
          chmod 755 "$APPDIR/usr/bin/modifs-pdfs"
          cp packaging/linux/modifs-pdfs.desktop "$APPDIR/modifs-pdfs.desktop"
          cp code/src/main/icons/linux/512.png "$APPDIR/modifs-pdfs.png"

          {
            echo '#!/bin/sh'
            echo 'HERE="$(dirname "$(readlink -f "${0}")")"'
            echo 'exec "${HERE}/usr/bin/modifs-pdfs" "$@"'
          } > "$APPDIR/AppRun"
          chmod 755 "$APPDIR/AppRun"

          curl -sSfL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./appimagetool "$APPDIR" "modifs-pdfs-${VERSION}-x86_64.AppImage"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact }}.zip

      - name: Upload Linux packages to release
        uses: softprops/action-gh-release@v2
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            modifs-pdfs_*.deb
            modifs-pdfs-*.AppImage
